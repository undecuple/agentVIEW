[package]
name = "agent-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only viewer for shared docs, gate status and diffs"

[dependencies]
agent-app-core = { path = "../core" }
tauri = { version = "=2.12.6", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-build = { version = "=2.7.5", default-features = false, features = [] }

[features]
# Test-only. Adds an e2e page and report endpoint. Never enabled in release builds.
e2e = []
