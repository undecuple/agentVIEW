name: ci
on:
  push:
  pull_request:
permissions: {}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: File and history checks (backstop for the pre-commit hook)
        run: ./scripts/check-history.sh '^[0-9]+\+undecuple@users\.noreply\.github\.com$|^noreply@github\.com$' HEAD '49699333+dependabot[bot]@users.noreply.github.com'
      - name: Tests
        run: python3 -I -W error -m unittest discover -s tests
      - name: Install Nix
        run: bash scripts/install-ci-nix.sh
      - name: Rust tests and desktop build (flake.lock toolchain)
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo-home
        run: nix develop --no-write-lock-file --command bash scripts/check-rust.sh
