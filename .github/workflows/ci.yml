name: ci
on:
  push:
  pull_request:
permissions: {}
jobs:
  checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: File and history checks (backstop for the pre-commit hook)
        run: ./scripts/check-history.sh '^[0-9]+\+undecuple@users\.noreply\.github\.com$|^noreply@github\.com$'
      - name: Tests
        run: python3 -I -W error -m unittest discover -s tests
