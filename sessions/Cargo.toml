[package]
name = "agent-app-sessions"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
libc = "0.2"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
